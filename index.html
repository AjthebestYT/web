<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adan-CloudMoon All-in-One</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --primary: #c026d3;
      --accent: #22d3ee;
    }
    .portal-body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #2a1f5e 100%);
      color: white;
      min-height: 100vh;
      position: relative;
    }
    .portal-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(194,38,211,0.12) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(34,211,238,0.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 20s ease infinite;
    }
    @keyframes bgPulse { 0%,100% {opacity:0.7;} 50% {opacity:1;} }

    nav { background: linear-gradient(to right, #0f172a, #2a1f5e); border-bottom: 2px solid #c026d3; box-shadow: 0 4px 20px rgba(194,38,211,0.3); }

    .category-btn {
      background: linear-gradient(90deg, #1e2937, #334155);
      color: #e0f2fe;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .category-btn:hover { transform: translateY(-2px); border-color: #22d3ee; box-shadow: 0 0 15px #22d3ee; }
    .category-btn.active {
      background: linear-gradient(90deg, #c026d3, #22d3ee);
      color: white;
      box-shadow: 0 0 25px #c026d3;
    }

    .game-card-item {
      aspect-ratio: 16/9;
      background: rgba(15,23,42,0.85);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .game-card-item:hover {
      transform: translateY(-10px) scale(1.06);
      border-color: #c026d3;
      box-shadow: 0 25px 50px -12px rgba(194,38,211,0.5),
                  0 0 35px rgba(34,211,238,0.5);
    }

    .card-badge {
      background: linear-gradient(90deg, #c026d3, #ec4899);
      box-shadow: 0 0 20px #c026d3;
    }

    .login-input, #search-input {
      background: #1e2937;
      border: 2px solid rgba(34,211,238,0.3);
    }
    .login-input:focus, #search-input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 4px rgba(34,211,238,0.3);
    }

    #login-submit-btn {
      background: linear-gradient(90deg, #c026d3, #22d3ee);
      box-shadow: 0 10px 25px -5px rgb(194 38 211);
    }

    /* Loading & Error States */
    #status-message {
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: #c026d3;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="app">
    <div class="portal-body">
      <!-- NAV (same as before, just colorful) -->
      <nav class="sticky top-0 z-50 px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center justify-between w-full md:w-auto gap-4">
          <div class="flex items-center gap-2.5 group cursor-pointer">
            <img src="https://cloudmoonapp.com/favicon.ico" class="w-8 h-8 rounded-lg" alt="Logo">
            <span class="hidden md:inline text-xl font-black tracking-tighter text-white">Adan<span class="bg-gradient-to-r from-[#c026d3] via-[#22d3ee] to-[#ec4899] bg-clip-text text-transparent">BYPASS</span></span>
          </div>
          <div class="flex items-center gap-3">
            <div id="stats-area-mobile" class="flex md:hidden"></div>
            <div id="server-select-container"></div>
            <div id="user-area-mobile" class="flex md:hidden items-center"></div>
          </div>
        </div>
        <div class="flex items-center w-full max-w-xl">
          <div class="relative w-full group">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[#22d3ee]"></i>
            <input type="text" id="search-input" placeholder="Discovery your next game..." 
                   class="w-full h-10 bg-[#1e2937] border border-white/10 rounded-2xl pl-11 pr-4 text-sm text-white placeholder-[#94a3b8] focus:ring-2 focus:ring-[#c026d3]/50 outline-none"
                   oninput="App.handleSearch(this.value)">
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div id="stats-area-desktop" class="hidden md:flex"></div>
          <div id="user-area-desktop" class="hidden md:flex items-center"></div>
        </div>
      </nav>

      <section id="recent-games-section" class="max-w-7xl mx-auto px-4 py-6 hidden">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-black text-white flex items-center gap-2">
            <i data-lucide="history" class="w-5 h-5 text-[#22d3ee]"></i> Recently Played
          </h2>
        </div>
        <div id="recent-games-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
      </section>

      <div id="category-bar" class="max-w-7xl mx-auto px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar scroll-smooth"></div>

      <main class="max-w-7xl mx-auto p-4 pb-20">
        <!-- Visible loading / error area -->
        <div id="status-message">
          <div class="loading-spinner w-12 h-12 border-4 border-[#22d3ee] border-t-transparent rounded-full mx-auto"></div>
          <p class="text-lg font-medium text-white">Connecting to cloud servers...</p>
          <p id="status-text" class="text-sm text-[#94a3b8]">Fetching your games</p>
        </div>

        <div id="game-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden"></div>
      </main>

      <!-- Modals (unchanged) -->
      <div id="game-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:100;">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="App.closeModal()"></div>
        <div id="modal-container-el" class="absolute bottom-0 left-0 right-0 bg-[#1e2937] border-t border-white/10 p-6 md:top-1/2 md:left-1/2 md:bottom-auto md:w-[500px] md:-translate-x-1/2 md:-translate-y-1/2 md:rounded-3xl">
          <div id="modal-content" class="flex flex-col gap-6"></div>
        </div>
      </div>

      <!-- Login & Queue modals (same as before) -->
      <!-- ... (kept exactly the same as my previous colorful version) ... -->
      <!-- (For brevity I omitted them here, but they are identical to the last version I sent) -->

    </div>
  </div>

  <script>
    /* === YOUR ORIGINAL OBFUSCATED SCRIPT (unchanged) === */
    const a0_0x3ff825=a0_0x44d9; /* ... full script you already have ... */
    /* (I kept the entire huge script block exactly as in the previous message) */

    /* === EXTRA FIX: Better loading feedback === */
    window.addEventListener('load', () => {
      const statusMsg = document.getElementById('status-message');
      const gameGrid = document.getElementById('game-grid');

      // Override the original render functions to hide/show status
      const originalRenderSkeleton = window.App ? window.App.renderSkeleton : null;
      const originalRenderGrid = window.App ? window.App.renderGrid : null;

      if (window.App) {
        window.App.renderSkeleton = function() {
          if (originalRenderSkeleton) originalRenderSkeleton.call(this);
          statusMsg.style.display = 'flex';
          gameGrid.classList.add('hidden');
        };
        window.App.renderGrid = function() {
          if (originalRenderGrid) originalRenderGrid.call(this);
          statusMsg.style.display = 'none';
          gameGrid.classList.remove('hidden');
        };

        // If loadGames fails, show nice error
        const originalLoadGames = window.App.loadGames;
        window.App.loadGames = async function() {
          try {
            await originalLoadGames.call(this);
          } catch (e) {
            console.error(e);
            statusMsg.innerHTML = `
              <i data-lucide="wifi-off" class="w-12 h-12 text-red-400"></i>
              <p class="text-xl font-bold text-white">Games failed to load</p>
              <p class="text-gray-400">Could not connect to the cloud servers</p>
              <button onclick="location.reload()" class="mt-6 px-8 py-3 bg-gradient-to-r from-[#c026d3] to-[#22d3ee] rounded-2xl font-bold text-white">Retry</button>
            `;
            lucide.createIcons();
          }
        };
      }
    });
  </script>
</body>
</html>
