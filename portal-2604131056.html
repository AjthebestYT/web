<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adan-CloudMoon All-in-One</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --primary: #c026d3;
      --accent: #22d3ee;
      --neon-pink: #ec4899;
    }
    .portal-body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #2a1f5e 100%);
      color: white;
      min-height: 100vh;
      position: relative;
    }
    .portal-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(194,38,211,0.12) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(34,211,238,0.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 20s ease infinite;
    }
    @keyframes bgPulse { 0%,100% {opacity:0.7;} 50% {opacity:1;} }

    nav {
      background: linear-gradient(to right, #0f172a, #2a1f5e);
      border-bottom: 2px solid #c026d3;
      box-shadow: 0 4px 20px rgba(194,38,211,0.4);
    }

    .category-btn {
      background: linear-gradient(90deg, #1e2937, #334155);
      color: #e0f2fe;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .category-btn:hover {
      transform: translateY(-2px);
      border-color: #22d3ee;
      box-shadow: 0 0 15px #22d3ee;
    }
    .category-btn.active {
      background: linear-gradient(90deg, #c026d3, #22d3ee);
      color: white;
      box-shadow: 0 0 25px #c026d3;
    }

    .game-card-item {
      aspect-ratio: 16/9;
      background: rgba(15,23,42,0.85);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .game-card-item:hover {
      transform: translateY(-10px) scale(1.06);
      border-color: #c026d3;
      box-shadow: 0 25px 50px -12px rgba(194,38,211,0.5),
                  0 0 35px rgba(34,211,238,0.5);
    }

    .card-badge {
      background: linear-gradient(90deg, #c026d3, #ec4899);
      box-shadow: 0 0 20px #c026d3;
    }

    .login-input {
      background-color: #1e2937;
      border: 2px solid rgba(34,211,238,0.3);
      transition: all 0.3s ease;
    }
    .login-input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 4px rgba(34,211,238,0.3);
    }

    #login-submit-btn {
      background: linear-gradient(90deg, #c026d3, #22d3ee);
      box-shadow: 0 10px 25px -5px rgb(194 38 211);
    }

    #status-box {
      min-height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="app">
    <div class="portal-body min-h-screen">
      <nav class="sticky top-0 z-50 px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center justify-between w-full md:w-auto gap-4">
          <div class="flex items-center gap-2.5 group cursor-pointer">
            <img src="https://cloudmoonapp.com/favicon.ico" class="w-8 h-8 rounded-lg" alt="Logo">
            <span class="hidden md:inline text-xl font-black tracking-tighter text-white">Adan<span class="bg-gradient-to-r from-[#c026d3] via-[#22d3ee] to-[#ec4899] bg-clip-text text-transparent">BYPASS</span></span>
          </div>
          <div class="flex items-center gap-3">
            <div id="stats-area-mobile" class="flex md:hidden"></div>
            <div id="server-select-container"></div>
            <div id="user-area-mobile" class="flex md:hidden items-center"></div>
          </div>
        </div>
        <div class="flex items-center w-full max-w-xl">
          <div class="relative w-full group">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[#22d3ee]"></i>
            <input type="text" id="search-input" placeholder="Discovery your next game..." class="w-full h-10 bg-[#1e2937] border border-white/10 rounded-2xl pl-11 pr-4 text-sm text-white placeholder-[#94a3b8] focus:ring-2 focus:ring-[#c026d3]/50 transition-all outline-none" oninput="App.handleSearch(this.value)">
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div id="stats-area-desktop" class="hidden md:flex"></div>
          <div id="user-area-desktop" class="hidden md:flex items-center"></div>
        </div>
      </nav>

      <section id="recent-games-section" class="max-w-7xl mx-auto px-4 py-6 hidden">
        <div class="flex items-center justify-between mb-4"><h2 class="text-lg font-black text-white flex items-center gap-2"><i data-lucide="history" class="w-5 h-5 text-[#22d3ee]"></i> Recently Played</h2></div>
        <div id="recent-games-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
      </section>

      <div id="category-bar" class="max-w-7xl mx-auto px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar scroll-smooth"></div>

      <main class="max-w-7xl mx-auto p-4 pb-20">
        <!-- Status message -->
        <div id="status-box" class="status-box">
          <div class="w-16 h-16 border-4 border-[#22d3ee] border-t-transparent rounded-full animate-spin"></div>
          <p class="text-2xl font-bold">Connecting to cloud servers...</p>
          <p id="status-text" class="text-[#94a3b8]">Fetching your games</p>
          <button onclick="manualRetry()" class="mt-8 px-10 py-4 bg-gradient-to-r from-[#c026d3] to-[#22d3ee] rounded-3xl font-bold text-white flex items-center gap-3">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i> Retry
          </button>
        </div>

        <div id="game-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden"></div>
      </main>

      <!-- Modals (unchanged) -->
      <div id="game-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:100;">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="App.closeModal()"></div>
        <div id="modal-container-el" class="absolute bottom-0 left-0 right-0 bg-[#1e2937] border-t border-white/10 p-6 md:top-1/2 md:left-1/2 md:bottom-auto md:w-[500px] md:-translate-x-1/2 md:-translate-y-1/2 md:rounded-3xl">
          <div id="modal-content" class="flex flex-col gap-6"></div>
        </div>
      </div>

      <div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:200;">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="App.closeLoginModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#1e2937] w-[90%] max-w-[400px] p-8 rounded-3xl border border-white/10">
          <h2 class="text-2xl font-bold bg-gradient-to-r from-[#c026d3] to-[#22d3ee] bg-clip-text text-transparent mb-6">Sign In</h2>
          <div class="space-y-4">
            <div><label class="block text-xs font-bold text-[#94a3b8] uppercase mb-2">Email Address</label><input type="email" id="login-email" class="login-input" placeholder="name@example.com"></div>
            <div><label class="block text-xs font-bold text-[#94a3b8] uppercase mb-2">Password</label><input type="password" id="login-password" class="login-input" placeholder="••••••••"></div>
            <div><label class="block text-xs font-bold text-[#94a3b8] uppercase mb-2">Region Server</label><select id="server-select" class="login-input cursor-pointer"><option value="21">South America</option><option value="22">US West</option><option value="23" selected>US East</option><option value="3">Asia</option><option value="4">Europe</option></select></div>
            <button id="login-submit-btn" onclick="App.handleLogin()" class="w-full text-white font-bold py-4 rounded-2xl transition mt-4">Sign In</button>
          </div>
        </div>
      </div>

      <div id="queue-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:300;">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#1e2937] w-[90%] max-w-[400px] p-8 rounded-3xl text-center">
          <div class="loading-spinner w-12 h-12 border-4 border-[#22d3ee] border-t-transparent rounded-full mx-auto mb-6"></div>
          <h2 class="text-2xl font-bold text-white mb-2">In Queue</h2>
          <p class="text-gray-400 mb-8">Waiting for an available cloud device...</p>
          <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-gradient-to-br from-[#1e2937] to-[#334155] rounded-2xl p-4"><span class="block text-xs text-[#94a3b8] uppercase font-bold mb-1">Position</span><span id="queue-pos" class="text-2xl font-bold text-white">--</span></div>
            <div class="bg-gradient-to-br from-[#1e2937] to-[#334155] rounded-2xl p-4"><span class="block text-xs text-[#94a3b8] uppercase font-bold mb-1">Est. Time</span><span id="queue-time" class="text-2xl font-bold text-white">--</span></div>
          </div>
          <button onclick="App.cancelQueue()" class="w-full bg-[#334155] hover:bg-[#c026d3] text-white font-bold py-4 rounded-2xl transition">Cancel Waiting</button>
        </div>
      </div>
    </div>
  </div>

    /* === DEBUG & RETRY FUNCTIONS === */
    function manualRetry() {
      const box = document.getElementById('status-box');
      box.innerHTML = `<div class="w-16 h-16 border-4 border-[#22d3ee] border-t-transparent rounded-full animate-spin"></div><p class="text-2xl font-bold">Trying again...</p>`;
      if (window.App && typeof window.App.loadGames === 'function') {
        window.App.loadGames().catch(e => showError(e.message || e));
      }
    }
    function showError(msg) {
      const box = document.getElementById('status-box');
      box.innerHTML = `
        <i data-lucide="alert-circle" class="w-16 h-16 text-red-400"></i>
        <p class="text-2xl font-bold text-white">Failed to load games</p>
        <p class="text-red-300">${msg}</p>
        <button onclick="manualRetry()" class="mt-8 px-10 py-4 bg-gradient-to-r from-[#c026d3] to-[#22d3ee] rounded-3xl font-bold text-white">Try Again</button>
      `;
      lucide.createIcons();
    }

    window.addEventListener('load', () => {
      lucide.createIcons();
      if (window.App) {
        setTimeout(() => window.App.loadGames().catch(showError), 800);
      } else {
        showError("App not loaded");
      }
    });
  </script>
</body>
</html>
